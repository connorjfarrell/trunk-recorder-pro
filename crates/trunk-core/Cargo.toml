[package]
name = "trunk-core"
description = "Trunked and conventional radio (P25, SmartNet, DMR, analog FM) decoding and call recording: channelizer, receivers, FEC, vocoders, trunking. Platform-independent (native and WebAssembly)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rustfft.workspace = true
num-complex.workspace = true
regex-lite = "0.1"
# MimoSDR's .sdr call container (frame capture). Zero dependencies; not on crates.io.
sdr_stream = { package = "sdr-stream", git = "https://github.com/MimoCAD/sdr-stream.git", rev = "8c4d293bc5b27732252faea5112dd5a37a2ed0bd" }
pbkdf2 = "0.13.0"
sha2 = "0.11.1"
hmac = "0.13.0"
aes = { version = "0.9.3", features = ["zeroize"] }
cbc = { version = "0.2.1", features = ["zeroize"] }
roxmltree = "0.21.1"
base64 = "0.23.1"
zeroize = "1.9.1"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
des = { version = "0.9.0", features = ["zeroize"] }

[dev-dependencies]
serde_json.workspace = true
