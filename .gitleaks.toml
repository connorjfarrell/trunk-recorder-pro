# gitleaks' default rules, plus an allowlist for the one fixture: a throwaway key container whose
# password is written in the tests (that one file). Nothing else.
[extend]
useDefault = true

[allowlist]
description = "the throwaway test container and its password"
paths = ['''crates/trunk-core/src/crypto/testdata/dummy-test-keys\.ekc''']
regexes = ['''testing1234''']
